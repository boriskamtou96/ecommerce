worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # Docker embedded DNS, so the storage backend is resolved at request
  # time instead of only once at startup.
  resolver 127.0.0.11 valid=30s ipv6=off;

  log_format cdn '$remote_addr "$request" $status $body_bytes_sent cache=$upstream_cache_status';
  access_log /var/log/nginx/access.log cdn;

  # This is what makes it a CDN rather than a plain reverse proxy:
  # objects are stored on disk and served without hitting S3 again.
  proxy_cache_path /var/cache/nginx/cdn
                   levels=1:2
                   keys_zone=cdn_cache:10m
                   max_size=1g
                   inactive=30d
                   use_temp_path=off;

  server {
    listen 80;
    server_name _;

    # Uploaded object names are random, so a given URL always maps to the
    # same bytes and can be cached forever.
    set $asset_cache_control "public, max-age=31536000, immutable";
    set $s3_bucket "ecommerce-uploads";

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # Only the product image prefix is exposed. The rest of the bucket
    # stays unreachable from the outside.
    location ~ ^/uploads/products/ {
      root /var/www;

      add_header Cache-Control $asset_cache_control always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Access-Control-Allow-Origin "*" always;

      # Served from the local volume when present, from object storage
      # otherwise.
      try_files $uri @storage;
    }

    location @storage {
      set $storage_backend "localstack:4566";

      rewrite ^/uploads/(.*)$ /$s3_bucket/$1 break;

      proxy_pass       http://$storage_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $storage_backend;

      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;

      proxy_cache            cdn_cache;
      proxy_cache_key        "$s3_bucket$request_uri";
      proxy_cache_valid      200 206 30d;
      proxy_cache_valid      404 1m;
      proxy_cache_lock       on;
      proxy_cache_revalidate on;
      proxy_cache_background_update on;
      proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
      proxy_ignore_headers   Set-Cookie Cache-Control Expires;

      # Content-Type now comes from the object metadata written at upload
      # time, so nothing has to be guessed or rewritten here.
      proxy_hide_header Cache-Control;
      proxy_hide_header Content-Disposition;
      proxy_hide_header Set-Cookie;
      proxy_hide_header x-amz-id-2;
      proxy_hide_header x-amz-request-id;
      proxy_hide_header x-amz-server-side-encryption;

      add_header Cache-Control $asset_cache_control always;
      add_header Content-Disposition "inline" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
      return 404;
    }
  }
}
